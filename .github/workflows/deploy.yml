name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # تم التعديل إلى '20' لتلبية متطلبات Next.js 16
          node-version: '20'
          # تم إزالة سطر 'cache: 'npm'' لحل مشكلة عدم وجود ملف القفل
      
      - name: Install dependencies
        # استخدام 'npm install' لضمان التثبيت بدون ملف قفل
        run: npm install
      
      - name: Build Next.js project
        run: npm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # تم إزالة سطر 'cname'
