name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # يمكن تغييرها إلى 'pnpm' إذا كان المشروع يستخدم pnpm
      
      - name: Install dependencies
        # تم التعديل من 'npm ci' إلى 'npm install' لحل مشكلة عدم وجود ملف القفل
        run: npm install
      
      - name: Build Next.js project
        # هذا الأمر يقوم بإنشاء المخرجات الساكنة (Static Output) في مجلد 'out'
        run: npm run build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # تم إزالة سطر 'cname: your-domain.com'
